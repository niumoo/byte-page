<style>
    body {
        background-color: rgba(255, 255, 255, 0);
    }

        text-align: center;
    }
    .post-time{

    }
    pre code.hljs{

        .hljs {

        }

    .post-toc{
        background: var(--lesslight);
        padding: 10px;
        border-radius: var(--border-radius);
        display: none;
    }
    .footer{
        text-align: center;
    }

        margin: 0 5px;

    /* 回到顶部*/
    #topBtn {display: none;position: fixed;bottom: 30px;right: 30px;z-index: 99;}
    /* 图片点击放大 */

    #img-lightbox{display: none;position: fixed;z-index: 1000;left: 0;top: 0;width: 100%;height: 100%;background-color: rgba(0,0,0,0.85);justify-content: center;align-items: center;cursor: zoom-out;}
    #img-lightbox.active{display: flex;}
    #img-lightbox img{max-width: 90%;max-height: 90%;object-fit: contain;}
    /* 代码块复制按钮 */
    .post-content pre{position: relative;}
    .copy-code-btn{position: absolute;top: 8px;right: 8px;padding: 4px 10px;font-size: 12px;line-height: 1.4;color: #666;background-color: rgba(255,255,255,0.9);border: 1px solid #ddd;border-radius: 4px;cursor: pointer;opacity: 0.6;transition: opacity 0.2s;}
    .copy-code-btn:hover{opacity: 1;background-color: #f0f0f0;color: #666}
    .copy-code-btn.copied{color: #2e7d32;border-color: #2e7d32;}
    @media (prefers-color-scheme: dark) {
        .copy-code-btn{color: #ccc;background-color: rgba(50,50,50,0.9);border-color: #555;}
        .copy-code-btn:hover{background-color: #444;}
        .copy-code-btn.copied{color: #81c784;border-color: #81c784;}
    }
</style>

<div id="topBtn"><p><a onclick="topFunction()"  style="font-size: 3em; cursor: pointer;"> 🔝</a></p></div>

<script>
    // 回到顶部
    // Get the button
    let mybutton = document.getElementById("topBtn");
    // When the user scrolls down 20px from the top of the document, show the button
    window.onscroll = function () {
        scrollFunction()
    };

    function scrollFunction() {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            mybutton.style.display = "block";
        } else {
            mybutton.style.display = "none";
        }
    }

    function topFunction() {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
    }

    // 目录显示
    let isVisible = false;

    function showToc() {
        var div = document.getElementById("toc");
        var link = document.getElementById("tocBtn");
        isVisible = !isVisible;
        div.style.display = isVisible ? "inline-block" : "none";
        link.innerHTML = isVisible ? '<i class="fa fa-pencil"></i> 隐藏目录' : '<i class="fa fa-pencil"></i> 显示目录';
    }


    // 字体大小调节
    let currentFontSize = 17; // 默认字体大小
    function changeFontSize(change) {
        currentFontSize += change;
        if (currentFontSize < 12) currentFontSize = 12;
        if (currentFontSize > 24) currentFontSize = 24;
        document.querySelector('.post-content').style.fontSize = currentFontSize + 'px';
    }

    // 图片点击放大
    function openImgLightbox(src) {
        var box = document.getElementById('img-lightbox');
        var img = document.getElementById('img-lightbox-img');
        img.src = src;
        box.classList.add('active');
    }

    function closeImgLightbox() {
        var box = document.getElementById('img-lightbox');
        box.classList.remove('active');
    }

    // 代码块复制
    function copyCode(btn) {
        var pre = btn.parentElement;
        var code = pre.querySelector('code');
        var text = code ? code.innerText : pre.innerText;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                showCopied(btn);
            }).catch(function(err) {
                fallbackCopy(text, btn);
            });
        } else {
            fallbackCopy(text, btn);
        }
    }

    function fallbackCopy(text, btn) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showCopied(btn);
        } catch (err) {
            console.error('复制失败', err);
        }
        document.body.removeChild(textarea);
    }

    function showCopied(btn) {
        var original = btn.innerText;
        btn.innerText = '已复制';
        btn.classList.add('copied');
        setTimeout(function() {
            btn.innerText = original;
            btn.classList.remove('copied');
        }, 2000);
    }

    function initPostFeatures() {
        var images = document.querySelectorAll('.post-content img');
        images.forEach(function(img) {
            img.addEventListener('click', function() {
                openImgLightbox(this.src);
            });
        });
        var pres = document.querySelectorAll('.post-content pre');
        pres.forEach(function(pre) {
            var btn = document.createElement('button');
            btn.className = 'copy-code-btn';
            btn.innerText = 'copy';
            btn.setAttribute('type', 'button');
            btn.onclick = function() { copyCode(this); };
            pre.appendChild(btn);
        });
    }
</script>
